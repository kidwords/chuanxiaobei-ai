<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 欢迎回来</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       NEUMORPHISM DESIGN SYSTEM
       ============================================================ */
    :root {
      --bg: #E3EDF5;
      --bg-darker: #D1DEEC;

      --sh-light: rgba(255, 255, 255, 0.9);
      --sh-dark:  rgba(163, 177, 198, 0.55);

      --shadow-out:    6px 6px 12px var(--sh-dark), -6px -6px 12px var(--sh-light);
      --shadow-out-sm: 4px 4px 8px  var(--sh-dark), -4px -4px 8px  var(--sh-light);
      --shadow-in:    inset 6px 6px 12px var(--sh-dark), inset -6px -6px 12px var(--sh-light);
      --shadow-in-sm: inset 4px 4px 8px  var(--sh-dark), inset -4px -4px 8px  var(--sh-light);

      --text-primary:   #4A5C73;
      --text-secondary: #7C8BA0;
      --accent:         #6C8EBF;
      --accent-2:       #8AAFD9;
      --danger:         #D98A8A;

      --radius-card: 28px;
      --radius-md:   16px;
      --radius-sm:   12px;

      --t: 200ms cubic-bezier(.4, 0, .2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Quicksand', 'Noto Sans SC', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       AUTH CARD
       ============================================================ */
    .auth {
      width: 400px;
      max-width: 100%;
      background: var(--bg);
      border-radius: var(--radius-card);
      padding: 32px 30px 28px;
      box-shadow: var(--shadow-out);
      position: relative;
    }

    /* ---------- Heading ---------- */
    .head {
      text-align: center;
      margin-bottom: 22px;
    }
    .brand {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--bg);
      box-shadow: var(--shadow-out-sm);
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      color: var(--accent);
    }
    .brand svg { width: 26px; height: 26px; }
    .head h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .head p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ---------- Segmented control ---------- */
    .seg {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
      border-radius: 999px;
      box-shadow: var(--shadow-in-sm);
      padding: 5px;
      margin-bottom: 22px;
    }
    .seg button {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 0;
      border-radius: 999px;
      cursor: pointer;
      transition: var(--t);
    }
    .seg button.active { color: var(--accent); }
    .seg .pill {
      position: absolute;
      z-index: 0;
      top: 5px;
      left: 5px;
      width: calc(50% - 5px);
      height: calc(100% - 10px);
      border-radius: 999px;
      background: var(--bg);
      box-shadow: var(--shadow-out-sm);
      transition: transform var(--t);
    }
    .seg[data-mode="register"] .pill { transform: translateX(100%); }

    /* ---------- Fields ---------- */
    .field {
      position: relative;
      margin-bottom: 14px;
    }
    .field-input {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-in-sm);
      padding: 0 14px;
      height: 50px;
      transition: var(--t);
    }
    .field.error .field-input {
      box-shadow:
        inset 4px 4px 8px var(--sh-dark),
        inset -4px -4px 8px var(--sh-light),
        0 0 0 1.5px rgba(217,138,138,.55),
        0 0 10px rgba(217,138,138,.25);
    }
    .field-ico {
      color: var(--text-secondary);
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }
    .field-ico svg { width: 18px; height: 18px; display: block; }
    .field-input input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      height: 100%;
      min-width: 0;
    }
    .field-input input::placeholder { color: var(--text-secondary); opacity: .8; }
    .eye-btn {
      border: none;
      background: var(--bg);
      box-shadow: var(--shadow-out-sm);
      width: 28px; height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--t);
      flex-shrink: 0;
    }
    .eye-btn:hover { color: var(--accent); }
    .eye-btn:active { box-shadow: var(--shadow-in-sm); transform: scale(.92); }
    .eye-btn svg { width: 15px; height: 15px; }

    .err-msg {
      font-size: 11px;
      color: var(--danger);
      margin-top: 5px;
      padding-left: 6px;
      height: 0;
      opacity: 0;
      overflow: hidden;
      transition: var(--t);
    }
    .field.error .err-msg { height: 16px; opacity: 1; }

    /* ---------- Row: remember + forgot ---------- */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    /* neumorphic checkbox */
    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
    }
    .check .box {
      width: 22px; height: 22px;
      border-radius: 7px;
      background: var(--bg);
      box-shadow: var(--shadow-out-sm);
      display: grid;
      place-items: center;
      color: transparent;
      transition: var(--t);
    }
    .check .box svg { width: 13px; height: 13px; }
    .check input { display: none; }
    .check input:checked + .box {
      box-shadow: var(--shadow-in-sm);
      color: var(--accent);
    }
    .check span.lbl { font-size: 13px; color: var(--text-secondary); }

    .forgot {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: var(--t);
    }
    .forgot:hover { opacity: .75; }

    /* ---------- Primary buttons ---------- */
    .btn-primary {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(145deg, var(--accent-2), var(--accent));
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      box-shadow: 4px 4px 10px var(--sh-dark), -4px -4px 10px var(--sh-light);
      transition: var(--t);
      margin-bottom: 18px;
    }
    .btn-primary:hover { opacity: .94; }
    .btn-primary:active {
      box-shadow: inset 4px 4px 8px rgba(0,0,0,.18), inset -4px -4px 8px rgba(255,255,255,.18);
      transform: scale(.985);
    }

    /* ---------- Divider ---------- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 16px;
    }
    .divider .line {
      flex: 1;
      height: 1px;
      background: var(--bg-darker);
    }
    .divider span {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: .1em;
    }

    /* ---------- Social ---------- */
    .social {
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .social button {
      width: 48px; height: 48px;
      border: none;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: var(--shadow-out-sm);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--t);
    }
    .social button:hover { transform: translateY(-3px); color: var(--accent); }
    .social button:active { box-shadow: var(--shadow-in-sm); transform: scale(.92); }
    .social button svg { width: 20px; height: 20px; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%) translateY(40px);
      background: var(--bg);
      box-shadow: var(--shadow-out);
      border-radius: 999px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      opacity: 0;
      pointer-events: none;
      transition: var(--t);
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .tick {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: var(--shadow-in-sm);
      display: grid;
      place-items: center;
      color: var(--accent);
    }
    .toast .tick svg { width: 13px; height: 13px; }

    /* hide confirm field in login mode */
    .auth[data-mode="login"] .confirm-field { display: none; }
    /* swap primary button label dynamically via JS */

    /* ---------- A11y ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="auth" id="auth" data-mode="login" role="region" aria-label="登录或注册">

    <!-- brand -->
    <div class="head">
      <div class="brand" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 7v6c0 5 8 9 8 9s8-4 8-9V7z"/><polyline points="9 12 11 14 15 10"/></svg>
      </div>
      <h1 id="formTitle">欢迎回来</h1>
      <p id="formSub">登录你的账户继续</p>
    </div>

    <!-- segmented control -->
    <div class="seg" id="seg" data-mode="login">
      <div class="pill"></div>
      <button type="button" data-mode="login" class="active">登录</button>
      <button type="button" data-mode="register">注册</button>
    </div>

    <!-- form -->
    <form id="form" novalidate>
      <!-- email -->
      <div class="field" id="f-email">
        <label class="field-input">
          <span class="field-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg>
          </span>
          <input type="email" id="email" placeholder="邮箱地址" autocomplete="email" />
        </label>
        <div class="err-msg">请输入有效的邮箱地址</div>
      </div>

      <!-- password -->
      <div class="field" id="f-password">
        <label class="field-input">
          <span class="field-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
          <input type="password" id="password" placeholder="密码" autocomplete="current-password" />
          <button type="button" class="eye-btn" id="eyeBtn" aria-label="显示或隐藏密码">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </label>
        <div class="err-msg">密码至少 6 位</div>
      </div>

      <!-- confirm password (register only) -->
      <div class="field confirm-field" id="f-confirm">
        <label class="field-input">
          <span class="field-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><polyline points="9 16 11 18 15 14"/></svg>
          </span>
          <input type="password" id="confirm" placeholder="确认密码" autocomplete="new-password" />
        </label>
        <div class="err-msg">两次输入的密码不一致</div>
      </div>

      <!-- row -->
      <div class="row">
        <label class="check">
          <input type="checkbox" id="remember" checked />
          <span class="box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span class="lbl">记住我</span>
        </label>
        <a href="#" class="forgot">忘记密码?</a>
      </div>

      <!-- primary -->
      <button type="submit" class="btn-primary" id="primaryBtn">登 录</button>
    </form>

    <!-- divider -->
    <div class="divider">
      <div class="line"></div><span>或使用</span><div class="line"></div>
    </div>

    <!-- social -->
    <div class="social">
      <button type="button" aria-label="使用 Google 登录">
        <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.2 14.7 2.2 12 2.2 6.9 2.2 2.8 6.4 2.8 11.7S6.9 21.3 12 21.3c5.9 0 9.8-4.1 9.8-9.9 0-.7-.1-1.2-.2-1.7H12z"/></svg>
      </button>
      <button type="button" aria-label="使用 GitHub 登录">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.6 2 12.3c0 4.6 2.9 8.4 7 9.8.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.4-3.4-1.4-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1.1 1.5 1.1.9 1.6 2.4 1.1 3 .9.1-.7.3-1.1.6-1.4-2.2-.3-4.6-1.2-4.6-5.2 0-1.1.4-2.1 1-2.8-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1.1.8-.2 1.6-.3 2.5-.3.8 0 1.7.1 2.5.3 1.9-1.4 2.7-1.1 2.7-1.1.5 1.4.2 2.4.1 2.7.6.7 1 1.7 1 2.8 0 4-2.4 4.9-4.6 5.2.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5 4.1-1.4 7-5.2 7-9.8C22 6.6 17.5 2 12 2z"/></svg>
      </button>
      <button type="button" aria-label="使用微信登录">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 4C5.4 4 2 6.7 2 10c0 1.8 1 3.5 2.7 4.6L4 17l2.6-1.4c.9.2 1.9.4 2.9.4h.6c-.1-.4-.2-.8-.2-1.2 0-3 2.9-5.4 6.5-5.4h.6C16.4 6.1 13.3 4 9.5 4zM7 8.2c.6 0 1 .4 1 1s-.5 1-1 1-1-.5-1-1 .4-1 1-1zm5 0c.6 0 1 .4 1 1s-.5 1-1 1-1-.5-1-1 .4-1 1-1z"/><path d="M22 14.4c0-2.5-2.5-4.6-5.6-4.6S10.8 11.9 10.8 14.4s2.5 4.6 5.6 4.6c.7 0 1.4-.1 2-.3l2.2 1.2-.6-1.9c1.2-.8 2-2.1 2-3.6zm-7.5-.8c-.4 0-.8-.4-.8-.8s.4-.8.8-.8.8.4.8.8-.4.8-.8.8zm3.8 0c-.4 0-.8-.4-.8-.8s.4-.8.8-.8.8.4.8.8-.4.8-.8.8z"/></svg>
      </button>
    </div>
  </main>

  <!-- toast -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="tick" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
    <span id="toastText">登录成功</span>
  </div>

  <script>
    /* ============================================================
       Auth card logic:
       - login/register segmented control with field swap
       - password show/hide
       - validation with neumorphic error states
       - success toast
       ============================================================ */
    (function () {
      const auth       = document.getElementById('auth');
      const seg        = document.getElementById('seg');
      const segBtns    = seg.querySelectorAll('button');
      const form       = document.getElementById('form');
      const emailEl    = document.getElementById('email');
      const passEl     = document.getElementById('password');
      const confirmEl  = document.getElementById('confirm');
      const eyeBtn     = document.getElementById('eyeBtn');
      const eyeIcon    = document.getElementById('eyeIcon');
      const primaryBtn = document.getElementById('primaryBtn');
      const formTitle  = document.getElementById('formTitle');
      const formSub    = document.getElementById('formSub');
      const toast      = document.getElementById('toast');
      const toastText  = document.getElementById('toastText');

      const EYE_OPEN  = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
      const EYE_CLOSE = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>';

      /* ---------- Mode switch ---------- */
      function setMode(mode) {
        auth.dataset.mode = mode;
        seg.dataset.mode = mode;
        segBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        if (mode === 'login') {
          formTitle.textContent = '欢迎回来';
          formSub.textContent = '登录你的账户继续';
          primaryBtn.textContent = '登 录';
        } else {
          formTitle.textContent = '创建账户';
          formSub.textContent = '注册一个新账户开始';
          primaryBtn.textContent = '注 册';
        }
        clearErrors();
      }
      segBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

      /* ---------- Password show/hide ---------- */
      eyeBtn.addEventListener('click', () => {
        const isPass = passEl.type === 'password';
        passEl.type = isPass ? 'text' : 'password';
        eyeIcon.innerHTML = isPass ? EYE_CLOSE : EYE_OPEN;
      });

      /* ---------- Validation ---------- */
      function clearError(field) {
        field.classList.remove('error');
      }
      function clearErrors() {
        document.querySelectorAll('.field').forEach(clearError);
      }
      function setError(field) { field.classList.add('error'); }

      // clear error on input
      [emailEl, passEl, confirmEl].forEach(el => {
        el.addEventListener('input', () => clearError(el.closest('.field')));
      });

      /* ---------- Toast ---------- */
      let toastTimer = null;
      function showToast(text) {
        toastText.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
      }

      /* ---------- Submit ---------- */
      form.addEventListener('submit', e => {
        e.preventDefault();
        clearErrors();
        let ok = true;
        const mode = auth.dataset.mode;

        const email = emailEl.value.trim();
        const pass  = passEl.value;

        const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRe.test(email)) { setError(document.getElementById('f-email')); ok = false; }
        if (pass.length < 6)      { setError(document.getElementById('f-password')); ok = false; }

        if (mode === 'register') {
          if (confirmEl.value !== pass || confirmEl.value.length === 0) {
            setError(document.getElementById('f-confirm')); ok = false;
          }
        }

        if (!ok) return;

        // success (demo only — no real auth)
        showToast(mode === 'login' ? '登录成功，欢迎回来' : '注册成功，欢迎加入');
      });
    })();
  </script>
</body>
</html>

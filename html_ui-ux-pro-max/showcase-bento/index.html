<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>便当盒网格深度探索 · 10 个示例 + 评分 + AI 提示词</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#FAFAFA;
    --dark:#1D1D1F; --text:#1D1D1F; --muted:#86868B; --muted-2:#6B7280;
    --accent:#0071E3; --accent-2:#6366F1;
    --pink:#FFE4E6; --blue:#DBEAFE; --green:#DCFCE7; --amber:#FEF3C7;
    --radius:26px; --radius-sm:16px;
    --shadow:0 4px 20px rgba(0,0,0,0.06);
    --shadow-hover:0 12px 36px rgba(0,0,0,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(245,245,247,0.8);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(0,0,0,0.06)}
  .nav{max-width:1400px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
  .brand .name{font-weight:700;font-size:16px}
  .brand .tag{font-size:11px;font-weight:500;color:var(--muted);padding:3px 10px;border-radius:999px;background:rgba(0,0,0,0.04)}
  .back-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted-2);font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:30px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:all .2s;border:1px solid rgba(0,0,0,0.04)}
  .back-link:hover{color:var(--text);transform:translateY(-1px)}

  .wrap{max-width:1400px;margin:0 auto;padding:0 28px 60px}

  /* Hero（本身就是 bento！） */
  .hero-grid{padding:32px 0 28px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
  .hero-main{grid-column:span 8;background:var(--dark);color:#fff;border-radius:var(--radius);padding:40px;position:relative;overflow:hidden}
  .hero-main::before{content:'';position:absolute;top:-40%;right:-20%;width:60%;height:180%;background:radial-gradient(circle,rgba(99,102,241,0.4),transparent 60%)}
  .hero-main h1{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.025em;margin-bottom:12px;position:relative}
  .hero-main h1 .grad{background:linear-gradient(120deg,#fff,#A5B4FC);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero-main p{color:rgba(255,255,255,0.7);font-size:15px;max-width:540px;position:relative}
  .hero-side{grid-column:span 4;display:grid;grid-template-rows:1fr 1fr;gap:16px}
  .hero-card{border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;justify-content:space-between}
  .hero-card.s-blue{background:var(--blue)}
  .hero-card.s-pink{background:var(--pink)}
  .hero-card .big{font-size:38px;font-weight:800;line-height:1;color:var(--text)}
  .hero-card .lbl{font-size:13px;color:var(--muted-2);font-weight:500;margin-top:6px}
  @media(max-width:860px){.hero-main,.hero-side{grid-column:span 12}.hero-side{grid-template-rows:auto;grid-template-columns:1fr 1fr}}

  /* 主体布局 */
  .layout{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
  @media(max-width:980px){.layout{grid-template-columns:1fr}}

  /* 左侧列表 */
  .sidebar{position:sticky;top:96px}
  .sidebar h3{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 12px 16px}
  .example-list{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);max-height:72vh;overflow-y:auto;border:1px solid rgba(0,0,0,0.04)}
  .ex-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;cursor:pointer;transition:all .2s}
  .ex-item:hover{background:rgba(0,0,0,0.03)}
  .ex-item.active{background:var(--dark)}
  .ex-item.active .num{background:#fff;color:var(--dark)}
  .ex-item.active .t,.ex-item.active .s{color:#fff}
  .ex-item .num{width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,0.05);display:grid;place-items:center;font-family:'JetBrains Mono';font-size:11.5px;font-weight:600;flex-shrink:0;transition:all .2s}
  .ex-item .info{min-width:0}
  .ex-item .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-item .s{font-size:11px;color:var(--muted)}

  /* 右侧面板 */
  .panel{display:flex;flex-direction:column;gap:18px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 26px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.04)}
  .panel-head .title-block h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .panel-head .title-block p{font-size:13px;color:var(--muted-2);margin-top:2px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;background:var(--surface);box-shadow:var(--shadow);color:var(--text);transition:all .2s;text-decoration:none;border:1px solid rgba(0,0,0,0.04)}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:#0062cc}
  .btn svg{width:15px;height:15px}

  /* 预览 */
  .preview-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:1px solid rgba(0,0,0,0.04);overflow:hidden}
  .preview-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 6px}
  .preview-bar .dots{display:flex;gap:6px}
  .preview-bar .dots i{width:11px;height:11px;border-radius:50%;background:rgba(0,0,0,0.1)}
  .preview-bar .dots i:nth-child(1){background:#FF5F57}
  .preview-bar .dots i:nth-child(2){background:#FEBC2E}
  .preview-bar .dots i:nth-child(3){background:#28C840}
  .preview-bar .url{font-family:'JetBrains Mono';font-size:11.5px;color:var(--muted);padding:6px 16px;border-radius:20px;background:var(--surface-2);flex:1;margin:0 14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .size-toggle{display:flex;gap:6px}
  .size-btn{width:34px;height:34px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .2s}
  .size-btn:hover{color:var(--text)}
  .size-btn.active{background:var(--dark);color:#fff;border-color:var(--dark)}
  .size-btn svg{width:16px;height:16px}
  .preview-frame-wrap{background:var(--surface-2);border-radius:14px;overflow:auto;max-height:680px;transition:all .3s}
  .preview-frame-wrap.device-mobile{max-width:390px;margin:0 auto}
  .preview-frame-wrap.device-tablet{max-width:820px;margin:0 auto}
  .preview-frame-wrap iframe{display:block;width:100%;height:640px;border:none;background:#fff;border-radius:14px}

  /* 评分 - 用 bento 风格展示 */
  .scores-bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .score-overall{grid-column:span 4;background:var(--dark);color:#fff;border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
  .score-overall::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(99,102,241,0.3),transparent 70%)}
  .score-overall .ring{position:relative;width:90px;height:90px;margin-bottom:14px}
  .score-overall .ring svg{transform:rotate(-90deg)}
  .score-overall .ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:'Inter';font-size:28px;font-weight:800}
  .score-overall .lbl{font-size:13px;color:rgba(255,255,255,0.6);font-weight:500;position:relative}
  .score-overall .lbl b{display:block;font-size:15px;color:#fff;margin-bottom:2px}
  .score-dims{grid-column:span 8;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .score-item{background:var(--surface);border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.03)}
  .score-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .score-item .top .name{font-size:12.5px;font-weight:600}
  .score-item .top .num{font-family:'Inter';font-size:14px;font-weight:700;color:var(--accent)}
  .score-item .bar{height:6px;border-radius:6px;background:rgba(0,0,0,0.06);overflow:hidden}
  .score-item .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .score-item .desc{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
  @media(max-width:860px){.score-overall,.score-dims{grid-column:span 12}.score-overall{flex-direction:row;justify-content:space-around}.score-overall .ring{margin-bottom:0}}

  /* 提示词 */
  .prompt-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;border:1px solid rgba(0,0,0,0.04)}
  .prompt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .prompt-head h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .prompt-head h3 .ic{width:30px;height:30px;border-radius:9px;background:var(--dark);color:#fff;display:grid;place-items:center}
  .prompt-body{background:#1D1D1F;border-radius:var(--radius-sm);padding:22px;max-height:480px;overflow-y:auto}
  .prompt-body::-webkit-scrollbar{width:8px}
  .prompt-body::-webkit-scrollbar-track{background:transparent}
  .prompt-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px}
  .prompt-body pre{font-family:'JetBrains Mono','Noto Sans SC',monospace;font-size:12.5px;line-height:1.8;color:#E5E5E7;white-space:pre-wrap;word-break:break-word}
  .prompt-body pre .k{color:#A5B4FC}

  /* Toast */
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);padding:14px 26px;border-radius:30px;background:var(--dark);color:#fff;font-size:14px;font-weight:600;z-index:100;transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-hover)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .reveal{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}
</style>
</head>

<div class="topbar">
  <nav class="nav">

<div class="wrap">

    </aside>

    <!-- 右侧面板 -->
    <main class="panel">

      <div class="preview-card reveal">
        <div class="panel-head" style="box-shadow:none;border:none;padding:0 6px 14px">

            <h2 id="exTitle">个人作品集</h2>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>

<script>
const EXAMPLES = [
{
  file:'01-portfolio.html', name:'个人作品集', desc:'设计师/开发者的模块化主页',
  scores:{视觉还原:94,布局张力:96,代码质量:88,可访问性:84,响应式:90,创新性:89},
  prompt:`请创建一个【便当盒网格（Bento Grid）】风格的个人作品集页面，单文件 HTML（内联 CSS + JS），简体中文界面。

## 设计系统（必须严格遵守）
- 页面背景 #F5F5F7（Apple 灰），卡片 #FFFFFF
- 核心特征：CSS Grid 布局，卡片尺寸【大小不一】——混合 1x1、2x1、1x2、2x2、3x1 跨列跨行。杂志式、不对称、视觉平衡。这是该风格的灵魂。
- 卡片：大圆角 24-28px，柔和阴影 0 4px 20px rgba(0,0,0,0.06)
- 少数卡片用深色（#1D1D1F 底 + 白字）制造对比，部分用柔和粉彩（#FFE4E6 粉 / #DBEAFE 蓝 / #DCFCE7 绿 / #FEF3C7 琥珀）
- 文字 #1D1D1F，次要 #6B7280/#86868B，强调 #0071E3 或 #6366F1
- 字体 Inter + Noto Sans SC（Google Fonts），大号粗标题 clamp()，行高 1.6
- 悬停：卡片 translateY(-4px) + 阴影加深，250-300ms 过渡，cursor:pointer
- 图标全用内联 SVG（Heroicons/Feather），禁止 emoji 当功能图标

## 内容需求（虚构人设 林墨白 · 全栈工程师/设计师）
1. 大号 HERO 卡（2x2 跨）：头像、姓名、职位、状态药丸"可接新项目"、2 个 CTA 按钮
2. 统计卡：5+ 年经验；"正在做"卡：项目名 + 小进度
3. 关于卡（2x1）：简短简介
4. 技能卡：4-5 项技能芯片或迷你进度条
5. 3-4 个作品卡（大小不一，一个大的特色 极光笔记 + 较小的 像素工坊/数据之眼/声波画廊），各带渐变封面、标题、技术标签
6. 联系/社交卡

## 技术要求
- lang="zh-CN"，viewport meta，自包含单文件（仅 Google Fonts 外部）
- 响应式：卡片在移动端优雅堆叠（auto-fit minmax，跨列降为 1 列）
- IntersectionObserver 交错入场动画，尊重 prefers-reduced-motion

请输出完整可运行的单文件 HTML。`
},
{
  file:'02-saas-landing.html', name:'SaaS 产品落地页', desc:'产品官网的模块化呈现',
  scores:{视觉还原:93,布局张力:95,代码质量:87,可访问性:83,响应式:89,创新性:88},
  prompt:`请创建一个【便当盒网格（Bento Grid）】风格的 SaaS 产品落地页，单文件 HTML（内联 CSS + JS），简体中文界面。虚构产品"极光笔记 Aurora"。

## 设计系统（必须严格遵守）
- 页面背景 #F5F5F7，卡片 #FFFFFF，大圆角 24-28px，柔和阴影 0 4px 20px rgba(0,0,0,0.06)

const DIM_DESC = {
  '视觉还原':'便当盒核心特征（模块化卡片、大小不一、圆角阴影）的实现程度',
  '布局张力':'卡片跨列跨行的错落感、视觉平衡与信息层级',
  '代码质量':'CSS Grid 结构、语义化、注释、可维护性',

  '响应式':'多断点适配、卡片优雅堆叠降级',
  '创新性':'在该风格下的创意表达与差异化',
};

let currentIdx = 0;

function renderList(){
  const list = document.getElementById('exList');
  list.innerHTML = EXAMPLES.map((e,i)=>`
    <div class="ex-item ${i===currentIdx?'active':''}" data-idx="${i}">
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="info"><div class="t">${e.name}</div><div class="s">${e.desc}</div></div>
    </div>`).join('');
  list.querySelectorAll('.ex-item').forEach(el=>{
    el.addEventListener('click',()=>{ currentIdx = +el.dataset.idx; renderAll(); });
  });
}

function renderAll(){
  const ex = EXAMPLES[currentIdx];
  document.getElementById('exTitle').textContent = ex.name;
  document.getElementById('exDesc').textContent = ex.desc;
  document.getElementById('exUrl').textContent = 'examples/' + ex.file;
  document.getElementById('openNew').href = 'examples/' + ex.file;
  document.getElementById('previewFrame').src = 'examples/' + ex.file;
  document.querySelectorAll('.ex-item').forEach((el,i)=>el.classList.toggle('active', i===currentIdx));
  renderScores(ex);
  document.getElementById('promptText').textContent = ex.prompt;
}

function renderScores(ex){
  const keys = Object.keys(ex.scores);
  const vals = Object.values(ex.scores);
  const avg = Math.round(vals.reduce((a,b)=>a+b,0) / vals.length);
  const circumference = 2 * Math.PI * 38;
  document.getElementById('ringFill').setAttribute('stroke-dasharray', circumference);
  document.getElementById('ringFill').setAttribute('stroke-dashoffset', circumference * (1 - avg/100));
  animateNum('overallScore', avg);
  document.getElementById('scoresGrid').innerHTML = keys.map(k=>{
    const v = ex.scores[k];
    return `<div class="score-item">
      <div class="top"><span class="name">${k}</span><span class="num">${v}</span></div>
      <div class="bar"><i data-pct="${v}"></i></div>
      <div class="desc">${DIM_DESC[k]}</div>
    </div>`;
  }).join('');
  requestAnimationFrame(()=>{
    document.querySelectorAll('.score-dims .bar i').forEach(b=>b.style.width = b.dataset.pct + '%');
  });
}

function animateNum(id, target){
  const el = document.getElementById(id);
  let cur = 0;
  const step = Math.max(1, Math.ceil(target/30));
  const t = setInterval(()=>{
    cur += step;
    if(cur >= target){cur = target; clearInterval(t);}
    el.textContent = cur;
  }, 25);
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  return Promise.resolve(document.execCommand('copy')).finally(()=>ta.remove());
}
document.getElementById('copyBtn').addEventListener('click', async ()=>{
  try{ await copyText(document.getElementById('promptText').textContent); showToast('已复制完整提示词到剪贴板'); }
  catch(e){ showToast('复制失败，请手动选择文本复制'); }
});

function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

document.querySelectorAll('.size-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const wrap = document.getElementById('frameWrap');
    wrap.classList.remove('device-mobile','device-tablet');
    if(btn.dataset.size==='mobile') wrap.classList.add('device-mobile');
    else if(btn.dataset.size==='tablet') wrap.classList.add('device-tablet');
  });
});

const io = new IntersectionObserver((es)=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in'); io.unobserve(e.target)}});

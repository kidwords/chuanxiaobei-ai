name: 部署到 Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# 防止并发部署互相覆盖;不取消进行中的部署,避免线上服务被中途打断
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并发布到 Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # Cloudflare 端面向根域名 dingbeichuan.com,不能带 BASE_PATH,
      # 否则静态资产路径会落到 /chuanxiaobei-ai 下导致 404
      - name: 构建静态站点
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""

      - name: 发布到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: ./
          # 强制使用 wrangler v4,因为 wrangler.jsonc 使用了 v4 语法(assets / routes)
          wranglerVersion: "^4"
          # 不传 command,默认执行 wrangler deploy
          # wrangler.jsonc 已配置 assets.directory=./out,会一并上传
          # routes.dingbeichuan.com 已声明 custom_domain:true,部署后自动绑定
        # wrangler-action v4 不再支持 apiToken/accountId inputs,
        # 改用 env 字段显式传入 wrangler 所需的环境变量
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

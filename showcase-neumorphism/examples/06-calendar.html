<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日历日程 · Neumorphism</title>

<!-- 字体：Quicksand + Noto Sans SC + JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

<style>
  /* ============ 新拟态设计系统变量 ============ */
  :root{
    --bg:#E3EDF5;
    --bg-darker:#D1DEEC;
    --sh-light:rgba(255,255,255,0.9);
    --sh-dark:rgba(163,177,198,0.55);

    /* 阴影：浮雕 / 凹陷 双向 */
    --shadow-out: 6px 6px 12px var(--sh-dark), -6px -6px 12px var(--sh-light);
    --shadow-in:  inset 6px 6px 12px var(--sh-dark), inset -6px -6px 12px var(--sh-light);
    --shadow-out-sm: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
    --shadow-in-sm:  inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);

    /* 文本 / 强调色 */
    --text-primary:#4A5C73;
    --text-secondary:#7C8BA0;
    --accent:#6C8EBF;
    --accent-soft:#A8BDD6;

    --radius-card:20px;
    --radius-mid:16px;
    --radius-small:12px;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text-primary);
    font-family:'Quicksand','Noto Sans SC',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  /* ============ 主容器 ============ */
  .app{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  /* ============ 头部：月份 + 导航 ============ */
  .header{
    background:var(--bg);
    border-radius:var(--radius-card);
    padding:20px 24px;
    box-shadow:var(--shadow-out);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .header-title{
    font-size:22px;
    font-weight:700;
    letter-spacing:.5px;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:12px;
  }

  /* 圆形按钮 */
  .icon-btn{
    width:42px;height:42px;
    border-radius:50%;
    background:var(--bg);
    box-shadow:var(--shadow-out-sm);
    border:none;
    color:var(--text-primary);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:box-shadow .2s ease, color .2s ease, transform .15s ease;
  }
  .icon-btn:hover{color:var(--accent);}
  .icon-btn:active{box-shadow:var(--shadow-in-sm);}

  /* "今天" 按钮 */
  .today-btn{
    height:38px;
    padding:0 16px;
    border-radius:var(--radius-small);
    background:var(--bg);
    box-shadow:var(--shadow-out-sm);
    border:none;
    color:var(--text-primary);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:box-shadow .2s ease, color .2s ease;
  }
  .today-btn:hover{color:var(--accent);}
  .today-btn:active{box-shadow:var(--shadow-in-sm);}

  /* ============ 日历主体卡片 ============ */
  .calendar-card{
    background:var(--bg);
    border-radius:var(--radius-card);
    padding:20px;
    box-shadow:var(--shadow-out);
  }

  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:12px;
  }
  .weekdays div{
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:var(--text-secondary);
    padding:6px 0;
  }

  .days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .day{
    aspect-ratio:1/1;
    border-radius:12px;
    background:var(--bg);
    box-shadow:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:500;
    color:var(--text-primary);
    cursor:pointer;
    position:relative;
    transition:box-shadow .18s ease, color .18s ease, transform .12s ease;
    border:none;
    font-family:'JetBrains Mono',monospace;
  }
  .day:hover{
    color:var(--accent);
  }
  /* 当前月外日期弱化 */
  .day.muted{color:var(--accent-soft);}
  /* 今日：凸起 + 强调色 */
  .day.today{
    box-shadow:var(--shadow-out-sm);
    color:var(--accent);
    font-weight:700;
  }
  /* 选中：凹陷 + 强调色填充 */
  .day.selected{
    box-shadow:var(--shadow-in-sm);
    color:#fff;
    background:linear-gradient(135deg,var(--accent),#7ea0c9);
  }
  .day.selected.today{color:#fff;}
  /* 有事件的点 */
  .day .dot{
    position:absolute;
    bottom:6px;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--accent);
    opacity:.7;
  }
  .day.selected .dot{background:#fff;opacity:.9;}

  /* ============ 事件面板 ============ */
  .events-card{
    background:var(--bg);
    border-radius:var(--radius-card);
    padding:20px 24px;
    box-shadow:var(--shadow-out);
  }
  .events-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .events-date{
    font-size:16px;
    font-weight:700;
  }
  .events-date .num{
    font-family:'JetBrains Mono',monospace;
    color:var(--accent);
    margin-right:4px;
  }
  .events-sub{
    font-size:12px;
    color:var(--text-secondary);
  }

  .event-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .event{
    background:var(--bg);
    border-radius:var(--radius-small);
    padding:14px 16px;
    box-shadow:var(--shadow-out-sm);
    display:flex;
    align-items:center;
    gap:14px;
    transition:box-shadow .2s ease, transform .15s ease;
  }
  .event:hover{transform:translateY(-1px);}
  .event:active{box-shadow:var(--shadow-in-sm);}

  .event-time{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:600;
    color:var(--accent);
    min-width:54px;
  }
  .event-body{flex:1;}
  .event-title{
    font-size:14px;
    font-weight:600;
    color:var(--text-primary);
    margin-bottom:2px;
  }
  .event-meta{
    font-size:12px;
    color:var(--text-secondary);
  }
  .event-tag{
    font-size:11px;
    color:var(--text-secondary);
    background:var(--bg);
    box-shadow:var(--shadow-in-sm);
    padding:5px 10px;
    border-radius:8px;
    font-weight:500;
  }

  /* 新建事件按钮 */
  .new-event{
    width:100%;
    height:48px;
    margin-top:14px;
    border:none;
    border-radius:var(--radius-small);
    background:var(--bg);
    box-shadow:var(--shadow-out-sm);
    color:var(--accent);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:box-shadow .2s ease, transform .12s ease;
  }
  .new-event:hover{transform:translateY(-1px);}
  .new-event:active{box-shadow:var(--shadow-in-sm);transform:none;}

  .empty-tip{
    text-align:center;
    color:var(--text-secondary);
    font-size:13px;
    padding:24px 0;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
  <main class="app" role="application" aria-label="日历日程应用">
    <!-- ========== 头部 ========== -->
    <header class="header">
      <div class="header-title" id="monthTitle">2024年 8月</div>
      <div class="header-actions">
        <button class="icon-btn" id="prevBtn" aria-label="上一月">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="today-btn" id="todayBtn">今天</button>
        <button class="icon-btn" id="nextBtn" aria-label="下一月">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </header>

    <!-- ========== 日历网格 ========== -->
    <section class="calendar-card">
      <div class="weekdays">
        <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
      </div>
      <div class="days" id="daysGrid"></div>
    </section>

    <!-- ========== 事件面板 ========== -->
    <section class="events-card">
      <div class="events-head">
        <div class="events-date"><span class="num" id="selDay">15</span><span id="selMonth">8月</span> 日程</div>
        <div class="events-sub" id="selWeekday">周四</div>
      </div>
      <div class="event-list" id="eventList"></div>
      <button class="new-event" id="newBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建事件
      </button>
    </section>
  </main>

<script>
  /* ============ 数据：日期 -> 事件 ============ */
  const EVENTS = {
    // key 形如 "2024-8-15"
    "2024-8-3":[
      {time:"09:30",title:"产品周会",meta:"会议室 A · 1小时",tag:"会议"},
    ],
    "2024-8-8":[
      {time:"10:00",title:"设计评审",meta:"线上 · Figma",tag:"评审"},
      {time:"14:30",title:"团队站会",meta:"会议室 B",tag:"日常"},
    ],
    "2024-8-15":[
      {time:"10:00",title:"设计评审",meta:"线上 · Figma 评审",tag:"评审"},
      {time:"14:30",title:"团队站会",meta:"会议室 B · 30分钟",tag:"日常"},
      {time:"18:00",title:"瑜伽课",meta:"健身房 · 1小时",tag:"生活"},
    ],
    "2024-8-22":[
      {time:"11:00",title:"客户拜访",meta:"国贸中心",tag:"外出"},
    ],
    "2024-8-27":[
      {time:"15:00",title:"项目交付",meta:"提交 v1.2 版本",tag:"里程碑"},
      {time:"20:00",title:"朋友聚餐",meta:"老地方烤肉",tag:"生活"},
    ],
  };

  const WEEKDAYS = ["周日","周一","周二","周三","周四","周五","周六"];

  /* 真实"今天" */
  const TODAY = new Date(2024,7,15); // 2024-8-15 作为演示今天
  /* 当前展示的年 / 月（0 基） */
  let viewYear = 2024;
  let viewMonth = 7;   // 8月
  /* 选中日期 */
  let selectedDate = new Date(2024,7,15);

  const $daysGrid = document.getElementById("daysGrid");
  const $monthTitle = document.getElementById("monthTitle");
  const $eventList = document.getElementById("eventList");
  const $selDay = document.getElementById("selDay");
  const $selMonth = document.getElementById("selMonth");
  const $selWeekday = document.getElementById("selWeekday");

  function keyOf(y,m,d){return `${y}-${m+1}-${d}`;}
  function isSameDate(a,b){return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();}

  function renderHeader(){
    $monthTitle.textContent = `${viewYear}年 ${viewMonth+1}月`;
  }

  function renderGrid(){
    $daysGrid.innerHTML="";
    const firstDay = new Date(viewYear, viewMonth, 1);
    // 周一为一周第一天：getDay() 周日=0
    let startOffset = firstDay.getDay() - 1;
    if(startOffset < 0) startOffset = 6; // 周日归到末列

    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();
    const totalCells = 42; // 6 行

    for(let i=0;i<totalCells;i++){
      let dayNum, cellDate, muted=false;
      if(i < startOffset){
        // 上月
        dayNum = prevMonthDays - startOffset + i + 1;
        cellDate = new Date(viewYear, viewMonth-1, dayNum);
        muted = true;
      } else if(i < startOffset + daysInMonth){
        // 本月
        dayNum = i - startOffset + 1;
        cellDate = new Date(viewYear, viewMonth, dayNum);
      } else {
        // 下月
        dayNum = i - startOffset - daysInMonth + 1;
        cellDate = new Date(viewYear, viewMonth+1, dayNum);
        muted = true;
      }

      const k = keyOf(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
      const hasEvent = !!EVENTS[k];

      const btn = document.createElement("button");
      btn.className = "day";
      if(muted) btn.classList.add("muted");
      if(isSameDate(cellDate, TODAY)) btn.classList.add("today");
      if(isSameDate(cellDate, selectedDate)) btn.classList.add("selected");
      btn.textContent = dayNum;
      btn.setAttribute("aria-label", `${cellDate.getFullYear()}年${cellDate.getMonth()+1}月${dayNum}日`);
      if(hasEvent){
        const dot = document.createElement("span");
        dot.className="dot";
        btn.appendChild(dot);
      }
      btn.addEventListener("click", ()=>{
        selectedDate = cellDate;
        // 如果点的是上下月日期，切换视图
        if(cellDate.getMonth() !== viewMonth){
          viewYear = cellDate.getFullYear();
          viewMonth = cellDate.getMonth();
        }
        renderHeader();
        renderGrid();
        renderEvents();
      });
      $daysGrid.appendChild(btn);
    }
  }

  function renderEvents(){
    const d = selectedDate;
    $selDay.textContent = d.getDate();
    $selMonth.textContent = `${d.getMonth()+1}月`;
    $selWeekday.textContent = WEEKDAYS[d.getDay()];

    const k = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
    const list = EVENTS[k] || [];
    if(list.length === 0){
      $eventList.innerHTML = `<div class="empty-tip">这一天暂无安排，享受空闲吧 ~</div>`;
      return;
    }
    $eventList.innerHTML = list.map(e => `
      <div class="event">
        <div class="event-time">${e.time}</div>
        <div class="event-body">
          <div class="event-title">${e.title}</div>
          <div class="event-meta">${e.meta}</div>
        </div>
        <div class="event-tag">${e.tag}</div>
      </div>
    `).join("");
  }

  /* 导航 */
  document.getElementById("prevBtn").addEventListener("click", ()=>{
    viewMonth--;
    if(viewMonth < 0){viewMonth = 11; viewYear--;}
    renderHeader(); renderGrid();
  });
  document.getElementById("nextBtn").addEventListener("click", ()=>{
    viewMonth++;
    if(viewMonth > 11){viewMonth = 0; viewYear++;}
    renderHeader(); renderGrid();
  });
  document.getElementById("todayBtn").addEventListener("click", ()=>{
    viewYear = TODAY.getFullYear();
    viewMonth = TODAY.getMonth();
    selectedDate = new Date(TODAY);
    renderHeader(); renderGrid(); renderEvents();
  });
  document.getElementById("newBtn").addEventListener("click", ()=>{
    alert(`为 ${selectedDate.getMonth()+1}月${selectedDate.getDate()}日 新建事件（演示）`);
  });

  /* 初始化 */
  renderHeader();
  renderGrid();
  renderEvents();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="中国传统色封面">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cb664a"/>
      <stop offset=".25" stop-color="#9c4a2c"/>
      <stop offset=".55" stop-color="#e0a04a"/>
      <stop offset=".85" stop-color="#3c6a4f"/>
      <stop offset="1" stop-color="#1f3a36"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
